services:
  postgres:
    image: postgres:16
    container_name: devfolio_postgres_dev
    environment:
      POSTGRES_USER: devfolio
      POSTGRES_PASSWORD: devfolio
      POSTGRES_DB: devfolio
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devfolio']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devfolio_redis_dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    container_name: devfolio_mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

  # ATS matching engine — exposed on 8000 so the locally-run API can reach it.
  ats-engine:
    build:
      context: services/ats-engine
    container_name: devfolio_ats_engine_dev
    ports:
      - '8000:8000'

  # Self-hosted LLM for AI Writing — exposed on 11434 so the locally-run API
  # can reach it. First run: `docker compose -f docker-compose.dev.yml exec
  # ollama ollama pull llama3.2:3b` (or whatever OLLAMA_MODEL you set).
  ollama:
    image: ollama/ollama:latest
    container_name: devfolio_ollama_dev
    volumes:
      - ollama_dev_data:/root/.ollama
    ports:
      - '11434:11434'

volumes:
  postgres_dev_data:
  redis_dev_data:
  ollama_dev_data:
